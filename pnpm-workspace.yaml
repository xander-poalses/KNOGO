packages:
  - "."
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@parcel/watcher': false
  '@sentry/cli': true
  esbuild: true
  unrs-resolver: false

packageExtensions:
  react-native-reanimated:
    peerDependencies:
      '@types/react': '^19.3.0'
  sonner:
    peerDependencies:
      '@types/react': '*'
  sonner-native:
    peerDependencies:
      '@types/react': '*'
